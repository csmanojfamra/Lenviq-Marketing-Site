# Build the site and run its guards on every change.
#
# The guards are the reason this repository can be published at all: they check that no draft
# ships, that every regulatory claim carries a source that can be opened, that no page counts or
# adoption figures are asserted, and that the domain is written down once. They came across with
# the site when it was split out — leaving them behind would have meant an independent repository
# with nothing watching what it says.
name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }

      - run: npm ci

      # `npm run typecheck`, not a bare `tsc`. The layout imports the build stamp, which is
      # GENERATED and gitignored — so on a fresh checkout it does not exist yet, and a typecheck
      # that runs before the build fails on a missing module. The script generates it first.
      # That is exactly how this workflow broke: it passed locally, where a previous build had
      # left the file lying around.
      - run: npm run typecheck
      - name: Build
        run: npm run build

      # Read the OUTPUT, not the source: the guards on claims and drafts scan what actually ships.
      - run: npx vitest run

      - name: Check the export
        run: |
          test -f out/sitemap.xml || { echo "no sitemap in the export"; exit 1; }
          test -f out/index.html  || { echo "no index.html in the export"; exit 1; }
          grep -rq "lenviq\.com" out/ && { echo "the export references a .com"; exit 1; }
          grep -rq "not reviewed, not published" out/ && { echo "an unreviewed draft is in the export"; exit 1; }
          # The site is indexable from 11 Aug 2026. What is still gated is the two generated
          # legal drafts, and each mechanism is checked separately — they protect the same thing
          # and fail independently, which is the point of having three.
          grep -q 'content="noindex' out/privacy/index.html || { echo "privacy is INDEXABLE"; exit 1; }
          grep -q 'content="noindex' out/terms/index.html   || { echo "terms is INDEXABLE"; exit 1; }
          grep -q "Disallow: /privacy/" out/robots.txt || { echo "privacy not disallowed"; exit 1; }
          grep -q "Disallow: /terms/"   out/robots.txt || { echo "terms not disallowed"; exit 1; }
          grep -q "/privacy/" out/sitemap.xml && { echo "privacy is in the sitemap"; exit 1; }
          grep -q "/terms/"   out/sitemap.xml && { echo "terms is in the sitemap"; exit 1; }
          # And the site as a whole must NOT have quietly re-gated itself.
          grep -q 'content="noindex' out/index.html && { echo "the home page is noindex again"; exit 1; }
          echo "indexable; privacy and terms excluded on all three mechanisms" 
          echo "pages: $(find out -name '*.html' | wc -l), sitemap URLs: $(grep -c '<loc>' out/sitemap.xml)"

      - uses: actions/upload-artifact@v4
        with: { name: site-export, path: out, retention-days: 14 }
