# ─────────────────────────────────────────────────────────────────────────────
# Cache-Control for lenviq.in
#
# Paste these blocks INSIDE the existing `server { ... }` block for the site.
# In aaPanel:  Website → lenviq.in → Config File → paste → Save → Reload nginx.
#
# WHY THIS EXISTS
#
# The host currently sends no Cache-Control header at all. With no directive
# every browser applies its own heuristic, and one of them held a screenshot
# long enough that a reader saw the compliance page several deploys old and
# reported the product as broken. The bytes on the server were correct the whole
# time.
#
# The images already carry a content fingerprint (?v=<sha1>), so a changed image
# is a changed URL and no cache can serve a stale one. These headers are what
# make the correct bytes CACHEABLE for a useful length of time instead of being
# re-fetched on every visit — which, from an origin ~200ms away, is the
# difference a reader feels.
#
# TWO RULES TO KNOW BEFORE EDITING
#
# 1. `add_header` in a `location` REPLACES every add_header inherited from the
#    server block — it does not merge. If the server block already sets security
#    headers (HSTS and friends), repeat them inside any location you add here,
#    or they silently stop being sent for those paths.
# 2. `always` makes the header apply to error responses too, not only 2xx/3xx.
#
# VERIFY AFTER RELOADING:  npm run check:delivery
# ─────────────────────────────────────────────────────────────────────────────

# Build output. Every filename contains a content hash, so a changed file is a
# changed URL and this can never serve something stale.
location ^~ /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# Subset fonts. Named by family and weight, replaced only by a new build.
location ^~ /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# Screenshots. NOT immutable — the filename is stable and only the ?v= query
# changes — so a week, which is long enough to matter and short enough that a
# reader who somehow lands on a bare URL is not stuck with it.
location ^~ /shots/ {
    add_header Cache-Control "public, max-age=604800" always;
}

# Logo, icons and the share card. Not fingerprinted and rarely changed.
location ^~ /brand/ {
    add_header Cache-Control "public, max-age=86400" always;
}

# ─────────────────────────────────────────────────────────────────────────────
# THE AI AND CRAWLER FILES — caching, and the charset that is currently missing
#
# `charset utf-8` is the point of this block, and it has to be here rather than
# in the application. These files are ROUTE HANDLERS in Next.js and each one
# already returns `Content-Type: text/plain; charset=utf-8` from its own code —
# but the site is `output: "export"`, so a route handler is written to disk as a
# plain file at build time and the Response headers are thrown away with the
# server that would have sent them. nginx then decides the type from the file
# extension, and its default for `.txt` carries no charset.
#
# Measured on the live site, 13 October 2026:
#
#     content-type: text/plain          <- no charset
#     bytes around "IRAC":  ... examined on \xe2\x80\x94 IRAC day-end ...
#
# The bytes are correct UTF-8 (46 em dashes in the file). A client with no
# charset to go on defaults to Latin-1 and renders each of them as "a" with a
# circumflex followed by two unprintables — so the live file reads "examined on
# A-tilde-euro-quote IRAC day-end classification" to the machines it was written
# for. Nothing in the application can fix that; only the header can.
#
# `text/plain` is already in nginx's default `charset_types`, so `charset utf-8`
# is sufficient for the .txt files. The .json file is typed
# `application/json`, which is UTF-8 by specification and needs no parameter.
#
# AFTER RELOADING, VERIFY — a charset fix nobody fetched is not a fix:
#     curl -sI https://lenviq.in/llms.txt | grep -i content-type
#     curl -s  https://lenviq.in/llms.txt | sed -n '3p'
# ─────────────────────────────────────────────────────────────────────────────
location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|build-info\.json|ai-products\.json)$ {
    charset utf-8;
    add_header Cache-Control "public, max-age=300" always;
}

# HTML LAST, and it must revalidate.
#
# A static export is a directory per route, so this is the catch-all. If the
# server block already has a `location / { ... }` — aaPanel usually writes one —
# do NOT add a second. Put the add_header line inside the existing one instead;
# two `location /` blocks is a config nginx will refuse to load.
#
# max-age=0 with must-revalidate means the browser may keep the copy but has to
# ask before using it. Without this a deploy is invisible until a heuristic
# expires, which is the whole problem this file exists to fix.
location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ $uri/index.html =404;
}

# ─────────────────────────────────────────────────────────────────────────────
# Redirects
#
# A slug that changes leaves its old URL returning 404 to anyone who linked it.
# A static export cannot redirect itself, so each one is a line here.
# ─────────────────────────────────────────────────────────────────────────────

# Renamed 30 Aug 2026. The post was titled around how money is stored, which is an
# engineering framing of a question a lender asks the other way round — why the
# reconciliation is off. Title, content and slug now all ask the reader's question.
location = /blog/interest-in-paise-not-float/ {
    return 301 /blog/reconciliation-off-by-rupees/;
}
